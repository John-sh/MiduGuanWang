name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        continue-on-error: true
        id: npmci
        run: npm ci

      - name: Build
        if: steps.npmci.outcome == 'success'
        continue-on-error: true
        run: npm run build -- --configuration production --base-href /MiduGuanWang/hgcompetition/

      - name: Prepare publish directory
        run: |
          mkdir -p dist/pages/hgcompetition dist/pages/apply dist/pages/orders
          if [ -d dist/honggong-cup-signup/browser ]; then
            cp -R dist/honggong-cup-signup/browser/. dist/pages/hgcompetition/
            cp dist/pages/hgcompetition/index.html dist/pages/hgcompetition/404.html
          fi
          cp -R apply/. dist/pages/apply/
          cp -R "订单与发票/." dist/pages/orders/
          cat > dist/pages/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="zh-CN">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>蜜度 MiduGuanWang</title>
            <style>
              body { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; margin: 48px auto; max-width: 640px; color: #1f2329; }
              a { color: #2b7cff; }
              li { margin: 10px 0; }
            </style>
          </head>
          <body>
            <h1>蜜度 MiduGuanWang</h1>
            <ul>
              <li><a href="./orders/">订单与发票中心</a></li>
              <li><a href="./apply/">申请试用</a></li>
              <li><a href="./hgcompetition/">洪工杯报名</a></li>
            </ul>
          </body>
          </html>
          EOF
          touch dist/pages/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
